<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bilan nutritionnel · Numineia</title>
<meta name="robots" content="noindex">
<style>html{color-scheme:light}body{margin:0;font-family:system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&display=swap">
<style>
/* Layout: a phone device frame on desktop, full-bleed on mobile. One screen at a time, slide transitions, result page scrolls inside the device.
   Palette from numineia.com: deep teal #18494F, sage #BBDABB, sand #D5C8B8, mint #EBF4EB, logo off-white #E3E1DC, DM Sans. One committed look: dark teal ground, light card. */
:root{
  --teal:#18494F; --teal-deep:#0E2F34; --sage:#BBDABB; --sand:#D5C8B8; --mint:#EBF4EB; --bone:#E3E1DC;
  --bg:#0E2F34; --bg2:#18494F;
  --card:#F7F5F1; --card-2:#FFFFFF;
  --fg:#15262A; --muted:#5E6E6B; --line:#DDD9D0;
  --accent:#18494F; --accent-2:#2F6F6A; --accent-soft:#E6EFE4; --accent-fg:#F7F5F1;
  --on-dark:#E3E1DC; --on-dark-muted:rgba(227,225,220,.7);
  --p-O:#18494F; --p-I:#8A6A3F; --p-D:#4C7A5A; --p-C:#8F4F4A;
  --grad:linear-gradient(160deg,#18494F 0%,#2F6F6A 45%,#BBDABB 100%);
  --shadow:0 40px 80px -30px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.06);
  --display:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --body:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);background-image:radial-gradient(90% 60% at 50% -10%,rgba(187,218,187,.35),transparent 60%),radial-gradient(60% 50% at 100% 100%,rgba(213,200,184,.18),transparent 60%),linear-gradient(180deg,var(--bg2),var(--bg) 70%);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5;padding-inline:16px;padding-block:14px 28px}
.stage{max-width:1040px;margin:0 auto;display:grid;grid-template-columns:1fr;gap:20px;align-items:start}
@media (min-width:860px){.stage{grid-template-columns:300px 420px;justify-content:center;gap:48px;padding-top:24px}}

/* side panel */
.side{display:flex;flex-direction:column;gap:16px;order:2}
@media (min-width:860px){.side{order:1;position:sticky;top:24px}}
.side .logo{height:22px;width:auto;color:var(--on-dark);display:block}
.side h1{font-family:var(--display);font-weight:300;font-size:30px;line-height:1.1;margin:0;letter-spacing:-.02em;text-wrap:balance;color:var(--on-dark)}
.side p{margin:0;color:var(--on-dark-muted);font-size:14px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{border:1px solid rgba(227,225,220,.25);background:transparent;color:var(--on-dark-muted);border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;font-weight:500;cursor:pointer;transition:all .15s}
.chip:hover{border-color:var(--sage);color:var(--on-dark)}
.chip[aria-pressed="true"]{background:var(--sage);color:var(--teal-deep);border-color:var(--sage)}
.chip:focus-visible,.opt:focus-visible,.btn:focus-visible,input:focus-visible,.jump:focus-visible{outline:2px solid var(--sage);outline-offset:2px}
.steps{display:flex;flex-direction:column;gap:2px;font-size:13px}
.jump{display:flex;align-items:center;gap:10px;background:transparent;border:0;color:var(--on-dark-muted);font:inherit;font-size:13px;padding:6px 8px;border-radius:8px;cursor:pointer;text-align:left}
.jump:hover{background:rgba(227,225,220,.08)}
.jump i{width:8px;height:8px;border-radius:50%;background:rgba(227,225,220,.25);flex:none}
.jump[aria-current="step"]{color:var(--on-dark);font-weight:600}
.jump[aria-current="step"] i{background:var(--sage);box-shadow:0 0 0 4px rgba(187,218,187,.25)}
.jump.done i{background:var(--sage);opacity:.6}
.events{border:1px dashed rgba(227,225,220,.25);border-radius:14px;padding:12px 14px;font-size:12px;color:var(--on-dark-muted);background:rgba(0,0,0,.15)}
.events summary{cursor:pointer;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.events ul{margin:8px 0 0;padding-left:16px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;display:flex;flex-direction:column;gap:2px;max-height:160px;overflow:auto}

/* device */
.device{order:1;background:var(--card);border-radius:28px;box-shadow:var(--shadow);overflow:hidden;position:relative;display:flex;flex-direction:column;height:min(760px,calc(100dvh - 60px));min-height:560px}
@media (min-width:860px){.device{order:2;height:780px;border-radius:40px;border:8px solid #0B2327}}
.notch{display:none}
@media (min-width:860px){.notch{display:block;position:absolute;top:10px;left:50%;transform:translateX(-50%);width:110px;height:26px;background:#0B2327;border-radius:999px;z-index:3}}
.head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:18px 22px 0}
@media (min-width:860px){.head{padding-top:46px}}
.head .logo{height:16px;width:auto;color:var(--teal);display:block}
.head small{font-size:10px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;font-weight:600}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--grad);color:var(--bone);display:grid;place-items:center;font-family:var(--display);font-weight:600;flex:none}
.progress{display:flex;gap:5px;margin:16px 22px 0}
.progress i{flex:1;height:5px;border-radius:3px;background:var(--line);overflow:hidden;position:relative}
.progress i::after{content:"";position:absolute;inset:0;background:var(--accent);transform:scaleX(0);transform-origin:left;transition:transform .4s cubic-bezier(.2,.8,.2,1)}
.progress i.done::after{transform:scaleX(1)}
.progress i.cur::after{transform:scaleX(.5);background:var(--accent-2)}

.viewport{flex:1;position:relative;overflow:hidden}
.screen{position:absolute;inset:0;overflow:auto;padding:22px 22px 26px;display:flex;flex-direction:column;gap:18px;animation:slideIn .38s cubic-bezier(.2,.8,.2,1)}
.screen.leaving{animation:slideOut .28s ease forwards;pointer-events:none}
@keyframes slideIn{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
@keyframes slideOut{to{opacity:0;transform:translateX(-30px)}}
@media (prefers-reduced-motion:reduce){.screen,.screen.leaving{animation:none}.opt,.result>*{animation:none!important}.progress i::after{transition:none}}

.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
h2{font-family:var(--display);font-weight:400;line-height:1.12;margin:0;text-wrap:balance;letter-spacing:-.02em;font-size:27px}
h2.big{font-size:34px;font-weight:300}
p{margin:0}
.muted{color:var(--muted)}
.spacer{flex:1}
.fine{font-size:13px;color:var(--muted)}

/* intro art: the site's ellipse glow */
.art{position:relative;height:160px;border-radius:18px;background:var(--teal);background-image:radial-gradient(70% 90% at 70% 110%,rgba(187,218,187,.9),rgba(187,218,187,0) 60%),radial-gradient(50% 60% at 10% 0%,rgba(213,200,184,.35),transparent 60%);overflow:hidden;flex:none}
.art span{position:absolute;border-radius:50%;border:1px solid rgba(235,244,235,.35);animation:float 7s ease-in-out infinite}
.art span:nth-child(1){width:220px;height:220px;right:-60px;top:-110px}
.art span:nth-child(2){width:140px;height:140px;right:20px;top:-50px;animation-delay:-3s}
.art span:nth-child(3){width:60px;height:60px;left:28px;top:22px;background:rgba(187,218,187,.25);border:0;animation-delay:-5s}
.art b{position:absolute;left:18px;bottom:16px;color:var(--bone);font-family:var(--display);font-weight:300;font-size:24px;line-height:1.1;letter-spacing:-.02em}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{font-size:12px;font-weight:600;padding:6px 10px;border-radius:999px;background:var(--accent-soft);color:var(--teal)}
.trust{display:flex;gap:10px;align-items:center;border-top:1px solid var(--line);padding-top:14px;font-size:13px;color:var(--muted)}
.trust .avatar{width:32px;height:32px;font-size:14px}

/* options */
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card-2);border:1.5px solid var(--line);border-radius:16px;padding:14px 16px;font:inherit;font-weight:500;color:var(--fg);cursor:pointer;transition:border-color .15s,background .15s,transform .12s;animation:rise .4s both;animation-delay:calc(var(--i)*60ms)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.opt:hover{border-color:var(--accent);transform:translateY(-1px)}
.opt:active{transform:scale(.985)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt .k{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;flex:none;position:relative;transition:all .15s;color:var(--accent-fg)}
.opt .k svg{width:14px;height:14px;opacity:0;transform:scale(.4);transition:all .18s}
.opt[aria-pressed="true"] .k{background:var(--accent);border-color:var(--accent)}
.opt[aria-pressed="true"] .k svg{opacity:1;transform:scale(1)}
.btn{appearance:none;border:0;border-radius:999px;background:var(--accent);color:var(--accent-fg);font:inherit;font-weight:600;font-size:16px;padding:15px 22px;cursor:pointer;width:100%;transition:transform .12s,filter .15s;display:flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{filter:brightness(1.12)}
.btn:active{transform:scale(.98)}
.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.btn[disabled]{opacity:.4;cursor:default;transform:none}
.btn svg{width:18px;height:18px}

.why{background:var(--teal);color:var(--bone);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:8px;position:relative;overflow:hidden;background-image:radial-gradient(60% 80% at 100% 120%,rgba(187,218,187,.6),transparent 60%)}
.why::before{content:"?";position:absolute;right:-4px;top:-34px;font-family:var(--display);font-size:150px;font-weight:300;color:var(--sage);opacity:.18;line-height:1}
.why b{color:var(--sage);font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:600}
.why p{font-size:19px;line-height:1.4;font-weight:300;position:relative}

.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:600}
.field input{font:inherit;padding:13px 14px;border:1.5px solid var(--line);border-radius:14px;background:var(--card-2);color:var(--fg);width:100%;transition:border-color .15s}
.field input:focus{border-color:var(--accent)}
.lock{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.lock svg{width:16px;height:16px}

/* loading */
.loader{display:flex;flex-direction:column;align-items:stretch;justify-content:center;gap:22px;flex:1}
.orb{width:84px;height:84px;border-radius:50%;margin:0 auto;background:conic-gradient(from 0deg,var(--teal),var(--accent-2),var(--sage),var(--sand),var(--teal));animation:spin 1.6s linear infinite;position:relative}
.orb::after{content:"";position:absolute;inset:8px;border-radius:50%;background:var(--card)}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.orb{animation:none}}
.checks{display:flex;flex-direction:column;gap:10px}
.check{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--muted);opacity:.35;transition:opacity .3s}
.check.on{opacity:1;color:var(--fg)}
.check i{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;flex:none;transition:all .2s;color:var(--accent-fg)}
.check.on i{background:var(--accent);border-color:var(--accent)}
.check i svg{width:12px;height:12px;opacity:0}
.check.on i svg{opacity:1}
.proof{text-align:center;font-size:13px;color:var(--muted);font-style:italic}

/* result */
.result{display:flex;flex-direction:column;gap:20px;--pc:var(--accent)}
.result>*{animation:rise .5s both;animation-delay:calc(var(--i)*90ms)}
.hero{border-radius:22px;padding:24px 22px;background:var(--pc);background-image:radial-gradient(70% 90% at 85% 115%,rgba(187,218,187,.85),rgba(187,218,187,0) 62%),radial-gradient(50% 60% at 0% 0%,rgba(213,200,184,.3),transparent 60%);color:var(--bone);position:relative;overflow:hidden;display:flex;flex-direction:column;gap:10px}
.hero::after{content:"";position:absolute;width:240px;height:240px;border-radius:50%;border:1px solid rgba(235,244,235,.35);right:-80px;top:-120px}
.hero .eyebrow{color:var(--sage)}
.hero h2{color:var(--bone);font-size:38px;font-weight:300;letter-spacing:-.03em}
.hero p{color:rgba(227,225,220,.92);font-size:15px;position:relative}
.dims{display:flex;flex-direction:column;gap:12px;border:1px solid var(--line);background:var(--card-2);border-radius:18px;padding:16px}
.dims h3{margin:0;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.dim{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:14px;font-weight:500}
.dim .bar{grid-column:1/-1;height:8px;background:var(--accent-soft);border-radius:4px;overflow:hidden}
.dim .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pc),var(--sage));border-radius:4px;transform:scaleX(0);transform-origin:left;transition:transform .9s cubic-bezier(.2,.8,.2,1)}
.dim .bar i.go{transform:scaleX(var(--v))}
.dim span:last-of-type{color:var(--muted);font-variant-numeric:tabular-nums}
.sec{display:flex;flex-direction:column;gap:8px}
.sec h3{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0;font-weight:600;display:flex;align-items:center;gap:8px}
.sec h3::before{content:"";width:18px;height:2px;background:var(--pc);border-radius:2px}
.sec p{font-size:16px}
.block{background:var(--accent-soft);border-radius:16px;padding:16px}
.block p{font-size:20px;line-height:1.3;color:var(--pc);font-weight:400;letter-spacing:-.01em}
.note{border:1px solid var(--line);background:var(--card-2);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:10px;font-size:15px}
.note .who{display:flex;align-items:center;gap:10px}
.note .who .avatar{width:34px;height:34px;font-size:14px}
.note .who b{display:block;font-size:14px}
.note .who small{color:var(--muted);font-size:12px}
.note .sig{font-family:var(--display);font-size:22px;font-weight:300;color:var(--pc);letter-spacing:-.02em}
.cta a{display:flex;text-decoration:none}
</style>
</head>

<div class="stage">

      r.dimNames.forEach((name,i)=>{ const d=el('div','dim'); const bar=el('div','bar'); const fill=el('i'); fill.style.setProperty('--v',vals[i]/100); bar.append(fill); d.append(el('span',null,name), el('span',null,vals[i]+' / 100'), bar); dm.append(d); bars.push(fill); });
      wrap.append(dm);

      const s1=el('div','sec'); s1.style.setProperty('--i',n++); s1.append(el('h3',null,r.means), el('p',null,[t.days[answers.q0??0],t.energy[answers.q3??0],...P.means].join(' '))); wrap.append(s1);
      const s2=el('div','sec block'); s2.style.setProperty('--i',n++); s2.append(el('h3',null,r.block), el('p',null,P.block)); wrap.append(s2);
      const s3=el('div','sec'); s3.style.setProperty('--i',n++); s3.append(el('h3',null,r.change), el('p',null,P.change+' '+t.goal[answers.q6??0])); wrap.append(s3);
      const cta=el('div','cta'); cta.style.setProperty('--i',n++); const a=el('a','btn',r.cta); a.href=LANDING; a.target='_blank'; a.rel='noopener'; a.append(svg(ARROW)); a.onclick=()=>track('cta_click',{profile:p}); cta.append(a); wrap.append(cta);
      const note=el('div','note'); note.style.setProperty('--i',n++); const who=el('div','who'); const wt=el('div'); wt.append(el('b',null,r.who), el('small',null,r.role)); who.append(el('div','avatar','S'),wt); note.append(who, el('p',null,t.note), el('span','sig',r.sig)); wrap.append(note);
      const back=el('button','btn ghost',r.back); back.type='button'; back.style.setProperty('--i',n++); back.onclick=restart; wrap.append(back);
      screen.append(wrap);
      timers.push(setTimeout(()=>bars.forEach(b=>b.classList.add('go')),350));
    }
  }

  function go(n,instant){ step=n; render(instant); }
  function restart(){ step=0; answers={}; lead={}; evList.innerHTML=''; render(true); }
  $('#lang-fr').onclick=()=>setLang('fr'); $('#lang-en').onclick=()=>setLang('en'); $('#restart').onclick=restart;
  render(true);
})();
</script>

</body>
</html>
